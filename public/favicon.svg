<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- Elegant Premium Golden/Amber Gradient -->
    <linearGradient id="gold-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEFA6" />
      <stop offset="35%" stop-color="#E5A93C" />
      <stop offset="100%" stop-color="#9A5C0F" />
    </linearGradient>
  </defs>

  <!-- Elegant Dark Slate Background (Matching the core layout theme) -->
  <rect width="32" height="32" rx="8" fill="#0b0f19" />

  <!-- Thin Premium Gold Outer Border -->
  <rect x="1.5" y="1.5" width="29" height="29" rx="6.5" fill="none" stroke="url(#gold-gradient)" stroke-width="1" opacity="0.4" />

  <!-- Main Heraldic Shield Crest -->
  <path d="M 16 6.5 C 20.5 6.5, 23.5 7.5, 24.5 10 C 25.5 15, 22.5 20.5, 16 26 C 9.5 20.5, 6.5 15, 7.5 10 C 8.5 7.5, 11.5 6.5, 16 6.5 Z" 
        fill="none" 
        stroke="url(#gold-gradient)" 
        stroke-width="1.5" 
        stroke-linejoin="round" />

  <!-- Elegant Inner Ribbon Accent -->
  <path d="M 9 10.5 C 11.5 9.5, 20.5 9.5, 23 10.5" 
        fill="none" 
        stroke="url(#gold-gradient)" 
        stroke-width="0.75" 
        opacity="0.6" />

  <!-- Professional Serif 'P' Monogram -->
  <!-- Combining a solid stem and a flowing bowl for an elite literary feel -->
  <g fill="url(#gold-gradient)">
    <!-- Main stem with serif terminals -->
    <path d="M 12.5 11.5 h 3.5 v 0.8 h -1.2 v 7.4 h 1.2 v 0.8 h -3.5 v -0.8 h 1.2 v -7.4 h -1.2 z" />
    <!-- Beautiful bold bowl for the letter P -->
    <path d="M 14.8 11.5 c 3.2 0, 4.7 1.1, 4.7 2.8 c 0 1.6, -1.3 2.7, -4.7 2.7 h -0.5 v -5.5 z" />
  </g>

  <!-- Bestseller Excellence Sparkle Star (at the top crown) -->
  <path d="M 16 2.5 L 16.6 4 L 18.1 4.6 L 16.6 5.2 L 16 6.7 L 15.4 5.2 L 13.9 4.6 L 15.4 4 Z" fill="#FFEFA6" />
</svg>

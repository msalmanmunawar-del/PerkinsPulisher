<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- Elegant Premium Golden/Amber Gradient -->
    <linearGradient id="gold-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>

  <!-- Elegant Dark Slate Round-Rect Background for premium contrast across all tab themes -->
  <rect width="32" height="32" rx="8" fill="#0b0f19" />

  <!-- Thin Premium Gold Border -->
  <rect x="1" y="1" width="30" height="30" rx="7" fill="none" stroke="url(#gold-gradient)" stroke-width="1.2" opacity="0.85" />

  <!-- Open Book Emblem -->
  <!-- Left Page Path -->
  <path d="M7 23.5C10 23.5 13.5 22 15 20.5V9.5C13.5 11 10 11.5 7 11.5V23.5Z" fill="url(#gold-gradient)" opacity="0.95" />
  
  <!-- Right Page Path -->
  <path d="M25 23.5C22 23.5 18.5 22 17 20.5V9.5C18.5 11 22 11.5 25 11.5V23.5Z" fill="url(#gold-gradient)" />

  <!-- Page folds at the bottom -->
  <path d="M7 23.5C10 23.5 13.5 24.5 15 25C16.5 24.5 20 23.5 25 23.5" fill="none" stroke="url(#gold-gradient)" stroke-width="1" stroke-linecap="round" />

  <!-- Central Spine Crease -->
  <path d="M16 9.5V24.5" stroke="#0b0f19" stroke-width="1.5" stroke-linecap="round" />

  <!-- Glowing Bestseller Sparkle/Star above the book -->
  <path d="M16 3.5L16.8 5.2L18.5 6L16.8 6.8L16 8.5L15.2 6.8L13.5 6L15.2 5.2Z" fill="#fef08a" />
</svg>

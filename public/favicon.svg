<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Deep Blue Background -->
  <rect width="512" height="512" fill="#0B1B3D" />

  <!-- Book Outline Container -->
  <g transform="translate(116, 120)" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Behind page layers for 3D/stacked effect -->
    <!-- Left outer pages -->
    <path d="M -15 35 Q 45 5, 115 45 L 115 225 Q 45 185, -15 215 Z" opacity="0.4" stroke-width="8" />
    <!-- Right outer pages -->
    <path d="M 295 35 Q 235 5, 165 45 L 165 225 Q 235 185, 295 215 Z" opacity="0.4" stroke-width="8" />

    <!-- Left secondary page -->
    <path d="M -5 20 Q 55 -10, 125 30 L 125 210 Q 55 170, -5 200 Z" opacity="0.7" stroke-width="10" />
    <!-- Right secondary page -->
    <path d="M 285 20 Q 225 -10, 155 30 L 155 210 Q 225 170, 285 200 Z" opacity="0.7" stroke-width="10" />

    <!-- Left main page -->
    <path d="M 10 5 Q 70 -25, 140 15 L 140 195 Q 70 155, 10 185 Z" fill="#0B1B3D" />
    <!-- Right main page -->
    <path d="M 270 5 Q 210 -25, 140 15 L 140 195 Q 210 155, 270 185 Z" fill="#0B1B3D" />
  </g>

  <!-- Big White Serif Letter 'P' in the Center -->
  <text x="256" y="305" 
        font-family="Georgia, 'Times New Roman', serif" 
        font-size="190" 
        font-weight="bold" 
        fill="#FFFFFF" 
        text-anchor="middle"
        style="letter-spacing: -2px;">P</text>

  <!-- PERKINS PUBLISHER text below the book -->
  <text x="256" y="420" 
        font-family="'Inter', 'Montserrat', 'Helvetica Neue', sans-serif" 
        font-size="28" 
        font-weight="900" 
        fill="#FFFFFF" 
        text-anchor="middle" 
        style="letter-spacing: 6px;">PERKINS</text>

  <text x="256" y="456" 
        font-family="'Inter', 'Montserrat', 'Helvetica Neue', sans-serif" 
        font-size="28" 
        font-weight="900" 
        fill="#FFFFFF" 
        text-anchor="middle" 
        style="letter-spacing: 6px;">PUBLISHER</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Deep Navy Background Disc for ultra-high contrast on all browser tabs -->
  <rect width="512" height="512" rx="110" fill="#0b1b3d" />

  <!-- Outer Circle Ring -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="#c59b27" stroke-width="14" />

  <!-- Open Book Group -->
  <g transform="translate(256, 262)">
    <!-- Left Page (Deep Royal Navy with 3 bright white manuscript lines) -->
    <path d="M -8 -60 
             C -56 -78, -118 -66, -150 -41 
             C -156 -8, -156 40, -150 72 
             C -118 50, -56 37, -8 59 
             Z" 
          fill="#10223b" 
          stroke="#ffffff" 
          stroke-width="3" />

    <!-- 3 White Manuscript Text Lines -->
    <line x1="-128" y1="-16" x2="-32" y2="-27" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round" />
    <line x1="-128" y1="11" x2="-32" y2="0" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round" />
    <line x1="-128" y1="38" x2="-32" y2="27" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round" />

    <!-- Center Golden Spine Accent -->
    <rect x="-7" y="-62" width="14" height="124" rx="3" fill="#c59b27" />

    <!-- Right Page (Ochre Gold) -->
    <path d="M 8 -60 
             C 56 -78, 118 -66, 150 -41 
             C 156 -8, 156 40, 150 72 
             C 118 50, 56 37, 8 59 
             Z" 
          fill="#c59b27" 
          stroke="#e8b943" 
          stroke-width="2" />
  </g>
</svg>